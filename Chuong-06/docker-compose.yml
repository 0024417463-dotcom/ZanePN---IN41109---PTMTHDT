services:
  api:
    build:
      context: .
      dockerfile: EduHub.API/Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      ConnectionStrings__DefaultConnection:
        "Host=postgres;Database=eduhub;Username=postgres;Password=${DB_PASSWORD}"
      JwtSettings__Issuer: "EduHub"
      JwtSettings__Audience: "EduHub"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eduhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eduhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
